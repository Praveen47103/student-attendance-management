<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mark Attendance - Admin Panel</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-logo">

            <div class="logo-icon">
                👑
            </div>

            <div>
                <h2>Admin Panel</h2>
                <span>Management</span>
            </div>

        </div>

        <nav class="navigation">

            <a href="admin-dashboard.html" class="nav-link">
                <span>🏠</span>
                <span>Dashboard</span>
            </a>

            <a href="admin-students.html" class="nav-link">
                <span>👥</span>
                <span>Students</span>
            </a>

            <a href="admin-classes.html" class="nav-link">
                <span>📚</span>
                <span>Classes</span>
            </a>

            <a href="admin-attendance.html" class="nav-link active">
                <span>📋</span>
                <span>Attendance</span>
            </a>

            <a href="admin-reports.html" class="nav-link">
                <span>📊</span>
                <span>Reports</span>
            </a>

            <a href="admin-faculty.html" class="nav-link">
                <span>👨‍🏫</span>
                <span>Faculty</span>
            </a>

            <a href="admin-timetable.html" class="nav-link">
                <span>📅</span>
                <span>Timetable</span>
            </a>

            <a href="admin-leave.html" class="nav-link">
                <span>📝</span>
                <span>Leave Requests</span>
            </a>

            <a href="admin-settings.html" class="nav-link">
                <span>⚙️</span>
                <span>Settings</span>
            </a>

        </nav>

        <div class="sidebar-bottom">

            <button id="logoutButton" class="logout-btn">
                🚪
                <span>Logout</span>
            </button>

        </div>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="main-content">

        <!-- TOP BAR -->

        <header class="topbar">

            <button id="menuButton" class="menu-button">
                ☰
            </button>

            <div class="topbar-title">

                <h1>Mark Attendance</h1>
                <p>Record attendance for classes</p>

            </div>

            <div class="topbar-user">

                <div class="user-avatar">
                    👑
                </div>

                <div class="user-info">

                    <strong id="adminName">Administrator</strong>
                    <span>Admin Account</span>

                </div>

            </div>

        </header>


        <!-- PAGE CONTENT -->

        <div class="page-content">

            <!-- SELECTION SECTION -->

            <div class="selection-section">

                <h3 class="section-title">📋 Select Details</h3>

                <div class="selection-grid">

                    <div class="form-group">
                        <label>Date *</label>
                        <input type="date" id="attendanceDate" required>
                    </div>

                    <div class="form-group">
                        <label>Class/Section *</label>
                        <select id="classSelect" required>
                            <option value="">-- Select Class --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Subject *</label>
                        <select id="subjectSelect" required>
                            <option value="">-- Select Subject --</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button id="loadStudentsBtn" class="btn btn-primary">
                            Load Students
                        </button>
                        <button id="resetFormBtn" class="btn btn-secondary">
                            Reset
                        </button>
                    </div>

                </div>

            </div>


            <!-- ATTENDANCE MARKING -->

            <div id="attendanceSection" class="attendance-section hidden">

                <h3 class="section-title">✅ Mark Attendance</h3>

                <div class="attendance-actions">

                    <button id="markAllPresentBtn" class="btn btn-success">
                        ✓ Mark All Present
                    </button>

                    <button id="markAllAbsentBtn" class="btn btn-danger">
                        ✗ Mark All Absent
                    </button>

                    <span class="attendance-stats">
                        Present: <strong id="presentCount">0</strong> | 
                        Absent: <strong id="absentCount">0</strong> | 
                        Total: <strong id="totalCount">0</strong>
                    </span>

                </div>

                <div class="attendance-list" id="attendanceList">
                    <!-- Students will be populated here -->
                </div>

                <div class="form-actions attendance-save">

                    <p id="statusMessage" class="form-message"></p>

                    <button id="saveAttendanceBtn" class="btn btn-primary">
                        💾 Save Attendance
                    </button>

                </div>

            </div>

        </div>

    </main>


    <!-- Supabase JS Client & Session Guard -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/session-guard.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/ai-assistant.js"></script>

    <!-- JavaScript -->

    <script src="js/admin-attendance.js"></script>

</body>

</html>
